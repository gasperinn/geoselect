<h1>GeoSelect — zero-build-step usage</h1>
<p>No bundler, no <code>type="module"</code> — just a script tag, like jQuery-era HTML.</p>

<geo-select
  default-center-city="Tokyo"
  default-zoom="4"
  allowed-countries="JP,KR,CN"
  language="en"
  style="height: 500px; width: 100%;"

></geo-select>

<!-- Local usage (this repo): -->
<script src="../dist/geoselect.global.js"></script>
<!-- Once published: <script src="https://cdn.jsdelivr.net/npm/geoselect/dist/geoselect.global.js"></script> -->

<script>
  document.querySelector('geo-select').addEventListener('change', (e) => {
    console.log('Selected:', e.detail.count, 'cities');
  });
</script>

</body>
